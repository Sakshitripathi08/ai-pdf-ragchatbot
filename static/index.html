<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI PDF RAG Chatbot</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172033; background: #f3f6fb; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 48px 20px; }
      main { max-width: 760px; margin: auto; }
      header { margin-bottom: 28px; }
      h1 { margin: 0 0 8px; font-size: clamp(2rem, 5vw, 2.8rem); letter-spacing: -0.04em; }
      header p, .hint { color: #64748b; line-height: 1.6; }
      section { margin: 18px 0; padding: 24px; background: white; border: 1px solid #e4eaf3; border-radius: 16px; box-shadow: 0 8px 24px #1720330a; }
      h2 { margin: 0 0 16px; font-size: 1.1rem; }
      label { display: block; margin: 14px 0 6px; font-weight: 600; font-size: .92rem; }
      input, textarea, button { width: 100%; padding: 12px 14px; border: 1px solid #d5deea; border-radius: 10px; font: inherit; }
      input:focus, textarea:focus { outline: 3px solid #bfdbfe; border-color: #3b82f6; }
      textarea { resize: vertical; }
      button { margin-top: 12px; color: white; background: #2563eb; border: 0; font-weight: 650; cursor: pointer; }
      button:hover { background: #1d4ed8; }
      button:disabled { opacity: .6; cursor: wait; }
      #answer { white-space: pre-wrap; min-height: 64px; line-height: 1.65; }
      .status { min-height: 24px; margin-top: 12px; color: #475569; }
      .hint { font-size: .86rem; margin-bottom: 0; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>AI PDF RAG Chatbot</h1>
        <p>Upload a PDF, then ask questions grounded in its contents.</p>
      </header>
      <section>
        <h2>Service access</h2>
        <label for="apiKey">API access key</label>
        <input id="apiKey" type="password" autocomplete="off" placeholder="Paste the API_KEY from your Render service environment" />
        <p class="hint">The key stays in this browser tab and is sent only to this app.</p>
      </section>
      <section>
        <h2>Upload a PDF</h2>
        <label for="pdfFile">PDF file</label>
        <input id="pdfFile" type="file" accept="application/pdf" />
        <button id="uploadBtn" type="button">Upload and index</button>
        <div id="uploadStatus" class="status" role="status" aria-live="polite"></div>
      </section>
      <section>
        <h2>Ask a question</h2>
        <label for="question">Your question</label>
        <textarea id="question" rows="4" maxlength="4000" placeholder="What is this document about?"></textarea>
        <button id="askBtn" type="button">Ask</button>
        <h2 style="margin-top:24px">Answer</h2>
        <div id="answer" role="status" aria-live="polite">Your answer will appear here.</div>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
